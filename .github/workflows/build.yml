# Build installers for macOS (Apple Silicon), Windows and Linux.
#
#   Push a tag like v0.2.0  -> a draft GitHub release with all installers attached.
#   Run it by hand (Actions -> build -> Run workflow) -> installers as downloadable artifacts.
#
# macOS builds are ad-hoc signed (no Apple Developer ID): downloaders allow the app once
# under System Settings -> Privacy & Security -> Open Anyway.
name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15          # Builds both macOS 14 CoreML and macOS 15 MLX helpers
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04      # oldest supported glibc for the AppImage/deb
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # whisper-rs-sys's build script does not rerun when a GGML_* variable
      # changes, so a cached whisper.cpp survives a change of build flags.
      # Change prefix-key whenever those flags change.
      - uses: swatinem/rust-cache@v2
        with:
          prefix-key: v2-ggml-portable-clangcl
          workspaces: |
            src-tauri
            bench

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libclang-dev cmake \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav

      # whisper.cpp's bindings are generated by bindgen, which needs libclang.
      # The Windows runners ship LLVM; macOS gets it from Xcode.
      - name: libclang on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

      # whisper.cpp otherwise compiles for the build server's own processor
      # (GGML_NATIVE), which has AVX-512: the result crashed with an illegal
      # instruction on an ordinary i7-9700K. Off, it targets AVX2/FMA/F16C/BMI2,
      # which every Intel Core since 2013 and every AMD Zen has; the app refuses
      # Whisper on processors without them (local::whisper_supported).
      - name: Portable whisper.cpp
        if: runner.os != 'macOS'
        shell: bash
        run: echo "GGML_NATIVE=OFF" >> "$GITHUB_ENV"

      # whisper.cpp built by MSVC ran Whisper base 7x slower than the same code
      # built by clang-cl (13.9 s against 2.0 s for 11 s of audio, i7-9700K,
      # measured with lana-bench). So on Windows it is compiled by clang-cl,
      # through Ninja inside a developer prompt. /EHsc because cmake-rs passes
      # clang-cl no exception flag; the CMP0091 policy because whisper.cpp's old
      # cmake_minimum_required otherwise ignores the runtime choice and builds
      # /MD, which cannot link with the rest of the app's /MT (crt-static).
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: clang-cl for whisper.cpp
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"
          {
            echo "CMAKE_GENERATOR=Ninja"
            echo "CMAKE_C_COMPILER=clang-cl"
            echo "CMAKE_CXX_COMPILER=clang-cl"
            echo "CXXFLAGS=-EHsc"   # not /EHsc: Git bash rewrites it into a path
            echo "CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded"
            echo "CMAKE_POLICY_DEFAULT_CMP0091=NEW"
            # The developer prompt sets VCINSTALLDIR, which makes rustc take
            # link.exe from PATH, and in a bash step that is Git's coreutils
            # `link`. Name MSVC's linker outright.
            echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=${VCToolsInstallDir}bin\\Hostx64\\x64\\link.exe"
          } >> "$GITHUB_ENV"
          cat "$GITHUB_ENV" | grep LINKER

      - name: praat-wasm
        shell: bash
        run: bash scripts/fetch-praat-wasm.sh

      # The ONNX Runtime library the built-in models run on, bundled beside the
      # app (CoreML on macOS, DirectML on Windows, CPU on Linux).
      - name: ONNX Runtime
        shell: bash
        run: bash scripts/fetch-onnxruntime.sh

      # Microsoft's onnxruntime.dll is built against the shared Visual C++
      # runtime, which not every Windows has: those four go beside it, as
      # Microsoft allows (app-local deployment), and local/runtime.rs loads them.
      - name: Visual C++ runtime beside onnxruntime.dll
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for f in vcruntime140.dll vcruntime140_1.dll msvcp140.dll msvcp140_1.dll; do
            cp "/c/Windows/System32/$f" src-tauri/onnxruntime/
          done

      - name: Tauri CLI
        run: cargo install tauri-cli --locked --version "^2"

      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.os == 'macOS'
        with:
          xcode-version: latest-stable

      - name: Native Mac model runners
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/build-mac-models.sh

      - name: Build
        shell: bash
        working-directory: src-tauri
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          # Signs the update packages (createUpdaterArtifacts); the app checks
          # them against the public key in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          find src-tauri/target/release/bundle \( -name '*.dmg' -o -name '*-setup.exe' \
               -o -name '*.deb' -o -name '*.AppImage' -o -name '*.app.tar.gz' -o -name '*.sig' \) -exec cp {} dist/ \;
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: lana-${{ matrix.os }}
          path: dist/*

      # lana-bench, the timing tool for calibrating model recommendations. An
      # artifact only, never attached to a release. Archived because artifact
      # zips drop the executable bit on macOS and Linux. The ONNX Runtime
      # library goes beside it, in onnxruntime/, where local/runtime.rs looks.
      - name: Build lana-bench
        shell: bash
        working-directory: bench
        run: |
          cargo build --release
          mkdir -p ../bench-dist
          if [ "$RUNNER_OS" = Windows ]; then
            mkdir -p ../bench-dist/lana-bench
            cp target/release/lana-bench.exe ../bench-dist/lana-bench/
            cp -r ../src-tauri/onnxruntime ../bench-dist/lana-bench/
          elif [ "$RUNNER_OS" = macOS ]; then
            tar czf ../bench-dist/lana-bench-$RUNNER_OS.tar.gz -C target/release lana-bench -C ../../../src-tauri onnxruntime mac-models
          else
            tar czf ../bench-dist/lana-bench-$RUNNER_OS.tar.gz -C target/release lana-bench -C ../../../src-tauri onnxruntime
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: lana-bench-${{ matrix.os }}
          path: bench-dist/*

      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*

  # latest.json, which the app's updater reads from the latest release: one
  # entry per platform with its package and signature. Written once all three
  # builds have attached theirs to the draft release.
  updater-manifest:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Write and attach latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir sigs && cd sigs
          gh release download "$TAG" -R "$REPO" -p '*.sig'
          ls -la
          python3 - <<'PY'
          import json, os, glob, datetime
          tag, repo = os.environ['TAG'], os.environ['REPO']
          base = f'https://github.com/{repo}/releases/download/{tag}/'
          want = {'darwin-aarch64': '.app.tar.gz.sig', 'windows-x86_64': '-setup.exe.sig', 'linux-x86_64': '.AppImage.sig'}
          platforms = {}
          for plat, suffix in want.items():
              hits = [f for f in glob.glob('*.sig') if f.endswith(suffix)]
              if hits:
                  platforms[plat] = {'signature': open(hits[0]).read().strip(), 'url': base + hits[0][:-4]}
          manifest = {'version': tag.lstrip('v'), 'notes': f'https://github.com/{repo}/releases/tag/{tag}',
                      'pub_date': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
                      'platforms': platforms}
          json.dump(manifest, open('latest.json', 'w'), indent=2)
          print(json.dumps(manifest, indent=2)[:800])
          assert len(platforms) == 3, 'a platform is missing its signature'
          PY
          gh release upload "$TAG" latest.json -R "$REPO" --clobber

