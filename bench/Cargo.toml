[package]
name = "lana-bench"
version = "0.1.0"
description = "Times Lana's built-in recognition models on this computer, for calibrating model recommendations"
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.80"

# The recognisers are src-tauri/src/local, included by path (see main.rs), so
# these are its dependencies, at the versions src-tauri's Cargo.lock pins.
[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "fs", "io-util", "time"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
whisper-rs = "0.16"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "alac"] }
sha2 = "0.10"
sha1 = "0.10"
sherpa-onnx = "1.13.8"
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "api-17", "alternative-backend"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
