[package]
name = "praat-desktop"
version = "0.1.0"
description = "Praat phonetic analysis with speech-recognised tiers, as a desktop app"
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
axum = "0.8"
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros"] }
tower-http = { version = "0.6", features = ["fs"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
