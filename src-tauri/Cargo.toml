[package]
name = "lana-desktop"
version = "0.1.9"
description = "Praat phonetic analysis with speech-recognised tiers, as a desktop app"
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# The native folder picker for the models folder, opened from the Rust side.
tauri-plugin-dialog = "2"
# Updates from GitHub Releases, verified against the public key in tauri.conf.json.
tauri-plugin-updater = "2"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "fs", "io-util"] }
tower-http = { version = "0.6", features = ["fs"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
mime_guess = "2"
whisper-rs = "0.16"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "alac", "aiff"] }
sha2 = "0.10"
sha1 = "0.10"
# Whisper's loop guard measures how well a piece's text compresses (local/mod.rs).
flate2 = "1"
# The GPU pack (local/gpupack.rs) comes as a .tgz and as wheels, which are zips.
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Every built-in model but Whisper, on an ONNX Runtime library shipped beside
# the app and loaded at run time (local/runtime.rs, scripts/fetch-onnxruntime.sh).
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "load-dynamic", "api-24"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The speed test (local/speedtest.rs) reports the processor and memory, and
# each child's peak memory.
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[features]
# whisper.cpp on the GPU through Vulkan, for Windows and Linux. Off by
# default: the executable then needs a Vulkan loader (vulkan-1.dll,
# libvulkan.so.1) to start at all, which VMs and minimal systems lack, and the
# build needs the Vulkan SDK. Untested on a real GPU so far.
whisper-vulkan = ["whisper-rs/vulkan"]

[profile.release]
lto = true
codegen-units = 1
strip = true

# Dependencies are optimised even in development builds: whisper.cpp built as
# Debug (cmake follows opt-level 0) transcribes many times slower, and symphonia
# decodes slowly too. Only Lana's own code stays quick to recompile.
[profile.dev.package."*"]
opt-level = 3
debug = false

# Linux: the microphone permission handler talks to WebKitGTK directly. Same
# version as wry uses, so this adds no second copy. CUDA is there for the GPU
# pack's runtime; the bundled one has only the CPU.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["cuda"] }

# Apple Silicon: whisper.cpp on the GPU through Metal, the ONNX models through
# CoreML. Untested until a Mac build.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
libc = "0.2"
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["coreml"] }

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["directml"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
