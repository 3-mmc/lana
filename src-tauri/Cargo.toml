[package]
name = "lana-desktop"
version = "0.1.8"
description = "Praat phonetic analysis with speech-recognised tiers, as a desktop app"
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# The native folder picker for the models folder, opened from the Rust side.
tauri-plugin-dialog = "2"
# Updates from GitHub Releases, verified against the public key in tauri.conf.json.
tauri-plugin-updater = "2"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "fs", "io-util"] }
tower-http = { version = "0.6", features = ["fs"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
mime_guess = "2"
whisper-rs = "0.16"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "alac", "aiff"] }
sha2 = "0.10"
sha1 = "0.10"
# Whisper's loop guard measures how well a piece's text compresses (local/mod.rs).
flate2 = "1"
# ZIPA (IPA phones) and speaker diarization. Static: links its own ONNX Runtime.
sherpa-onnx = "1.13.8"
# The CTC models' frame probabilities (confidence, re-timing, search), run on
# the ONNX Runtime sherpa-onnx links rather than a second copy: see local/frames.rs.
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "api-17", "alternative-backend"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Dependencies are optimised even in development builds: whisper.cpp built as
# Debug (cmake follows opt-level 0) transcribes many times slower, and symphonia
# decodes slowly too. Only Lana's own code stays quick to recompile.
[profile.dev.package."*"]
opt-level = 3
debug = false

# Linux: the microphone permission handler talks to WebKitGTK directly. Same
# version as wry uses, so this adds no second copy.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

# Apple Silicon: whisper.cpp on the GPU through Metal. Untested until a Mac build.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
