# Windows: link the C runtime statically.
#
# With crt-static, Rust uses /MT and the cmake crate builds whisper.cpp with
# /MT to match, so Lana's own executable needs no Visual C++ redistributable.
# (This began with sherpa-onnx, whose static libraries were /MT only. The ONNX
# Runtime DLL Lana loads now is /MD: its runtime DLLs ship beside it, see
# local/runtime.rs.)
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
